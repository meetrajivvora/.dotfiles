# Use Ctrl-Space instead of Ctrl-b (easier to reach)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split panes with \ and -
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Move between panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with prefix + Shift+arrow
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# Mouse support (click to select panes, scroll, resize)
set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Start window numbering at 1 (0 is far from the rest)
set -g base-index 1
setw -g pane-base-index 1

# Active window tab - soft pastel blue
set -g window-status-current-style 'bg=colour111,fg=colour234,bold'

# Inactive window tabs
set -g window-status-style 'bg=default,fg=colour248'

# Customize panes UI
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_title} "

# Active pane border - pastel lavender, match bg to window bg
set -g pane-active-border-style 'fg=colour183,bg=colour232'

# Inactive pane border - match bg to window bg
set -g pane-border-style 'fg=colour236,bg=colour234'

# Active pane: pure black, white text
set -g window-active-style 'bg=colour232, fg=colour255'

# Inactive: gray tint, gray text
set -g window-style 'bg=colour234,fg=colour245'

# Fix claude code scrolling from disappearing
set -g terminal-overrides 'xterm*:smcups@:rmcups@'

# Copy-paste support to clipboard
# pbcopy is macOS-only; wl-copy is the Linux/Wayland equivalent (reads stdin).
# set -s copy-command 'pbcopy'
set -s copy-command 'wl-copy'

# Renaming panes ('.' is the button after ctrl-s)
bind . command-prompt -p "Pane title:" 'select-pane -T "%%"'

# Prevent programs from renaming panes
set -g allow-rename off
set -g allow-set-title off

# Fix invisible cursor issue in iTerm2
# set -g terminal-overrides ',*:cnorm=\E[?12h\E[?25h'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# ------------------------------------------------------------
# Session persistence (tmux-resurrect + tmux-continuum)
# ------------------------------------------------------------
# Install once per machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   ~/.tmux/plugins/tpm/bin/install_plugins
# or inside tmux: prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 minutes; restore on tmux server start.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Start tmux at user login (systemd user unit); restore then happens automatically.
set -g @continuum-boot 'on'
# Save scrollback contents (useful after reboot; costs some disk/time).
set -g @resurrect-capture-pane-contents 'on'

# Explicit script paths so auto-save/restore works even if the plugin's own
# resurrect.tmux is not sourced by the plugin manager.
set -g @resurrect-save-script-path "/home/meetrajivvora/.tmux/plugins/tmux-resurrect/scripts/save.sh"
set -g @resurrect-restore-script-path "/home/meetrajivvora/.tmux/plugins/tmux-resurrect/scripts/restore.sh"
bind C-s run-shell -b "/home/meetrajivvora/.tmux/plugins/tmux-resurrect/scripts/save.sh; tmux display-message 'Session saved'"
bind S run-shell -b "/home/meetrajivvora/.tmux/plugins/tmux-resurrect/scripts/save.sh; tmux display-message 'Session saved'"
bind C-r run-shell -b "/home/meetrajivvora/.tmux/plugins/tmux-resurrect/scripts/restore.sh; tmux display-message 'Session restored'"

run '~/.tmux/plugins/tpm/tpm'
